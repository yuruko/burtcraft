plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}"
    id "maven-publish"
}

// jackson isn't shipped by minecraft or any of our mod deps, so it has to ride
// inside the mod jar. the old build did that with the shadow plugin feeding
// remapJar; loom 1.17 has no remapJar (26.1.2 ships unobfuscated), so `jar` is
// the shipped artifact and folds these in itself - see the `jar` block below.
configurations {
    bundle
    implementation.extendsFrom(bundle)
}

// mc 26.1.2 needs java 25
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

base {
    archivesName = project.archives_base_name
}
version = project.mod_version
group = project.maven_group

repositories {
    mavenCentral()
    maven {
        name = "MarvionKiritoRepo"
        url = "https://marvionkirito.github.io/maven/"
    }
    maven {
        name = 'babbaj-repo'
        url = 'https://babbaj.github.io/maven/'
    }
    // the locally built baritone fork. `baritone_libs` overrides the location
    // (used by the port workspace); the default is the sibling checkout.
    flatDir {
        dirs project.hasProperty('baritone_libs')
            ? project.baritone_libs
            : "${rootDir}/../baritone/fabric/build/libs"
    }
}

dependencies {
    // to change the versions see the gradle.properties file.
    // 26.1.2 ships unobfuscated - there is NO mappings() line any more, we
    // compile straight against the official mojang names.
    // loom 1.17 dropped the mod* configurations - nothing needs remapping when
    // the game ships unobfuscated, so these are plain dependencies now.
    minecraft("com.mojang:minecraft:${project.minecraft_version}")
    implementation("net.fabricmc:fabric-loader:${project.loader_version}")
    implementation("net.fabricmc.fabric-api:fabric-api:${project.fabric_version}")

    // Jackson JSON - bundled into the mod jar (see the `bundle` configuration)
    bundle 'com.fasterxml.jackson.core:jackson-core:2.19.0'
    bundle 'com.fasterxml.jackson.core:jackson-annotations:2.19.0'
    bundle 'com.fasterxml.jackson.core:jackson-databind:2.19.0'

    // Nether pathfinder (matches baritone 26.1's version). compile-only in effect -
    // baritone jar-in-jars its own copy, so it's already on the runtime classpath.
    implementation 'dev.babbaj:nether-pathfinder:1.6'

    // burnt's baritone fork, built locally from ../baritone
    implementation ":baritone-unoptimized-fabric:${project.baritone_version}"
    include ":baritone-unoptimized-fabric:${project.baritone_version}"
}

// loom 1.17 has no remapJar task any more (26.1.2 ships unobfuscated, so there is
// nothing to remap), so `jar` IS the shippable mod jar: loom already hangs the
// jar-in-jar nested mods (burnt's baritone fork) off it, and we fold the bundled
// libraries in here rather than through a separate shadow pass. shadow can't do
// this job any more - it treats a nested .jar as an archive to merge and would
// explode baritone's classes (and its own fabric.mod.json) into the top level.
jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from({ configurations.bundle.collect { it.isDirectory() ? it : zipTree(it) } }) {
        exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/MANIFEST.MF'
        exclude 'module-info.class', 'META-INF/versions/**/module-info.class'
    }
}

// the old two-`from(srcDirs)` + EXCLUDE idiom stopped expanding ${version} on this
// gradle/loom - the task's own default spec now wins the duplicate and the raw file
// ships. filesMatching edits the task's real file tree, so it can't be shadowed.
processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

// ensure that the encoding is set to UTF-8, no matter what the system default is
// this fixes some edge cases with special characters not displaying correctly
// see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 25
    // during the 26.1 port we want the WHOLE error list, not javac's first 100
    options.compilerArgs << '-Xmaxerrs' << '10000' << '-Xmaxwarns' << '50'
}

// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
// if it is present.
// If you remove this task, sources will not be generated.
tasks.register('sourcesJar', Jar) {
    dependsOn classes
    archiveClassifier = 'sources'
    from sourceSets.main.allSource
}

// configure the maven publication
publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact(tasks.named('jar'))
            artifact(tasks.named('sourcesJar'))
        }
    }

    // select the repositories you want to publish to
    repositories {
        // uncomment to publish to the local maven
        // mavenLocal()
    }
}
