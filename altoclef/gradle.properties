# Gradle performance improvements
org.gradle.jvmargs=-Xmx4096M -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.vfs.watch=true
kapt.use.worker.api=true
kapt.include.compile.classpath=false
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.warning.mode=all
# loom isn't configuration-cache compatible yet
org.gradle.configuration-cache=false
# Fabric Properties
# check these on https://fabricmc.net/develop
# 26.1.2 ships unobfuscated - there is NO yarn mappings line any more
minecraft_version=26.1.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT
# Mod Properties
mod_version=26.1.2-beta1
maven_group=gaucho-matrero.altoclef
archives_base_name=altoclef
# Dependencies
fabric_version=0.155.2+26.1.2
# burnt's baritone fork (built from ../baritone -> fabric/build/libs)
baritone_version=1.18.0
org.gradle.daemon.idletimeout=60000
